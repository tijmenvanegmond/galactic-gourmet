<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galactic Gourmet — Sol</title>
    <style>
      /*
        Almost all of the HUD lives on the canvas now — see src/panels.ts. What
        is left out here is the chrome that has no business inside the frame:
        the status line, the controls, and the time scale.
      */
      :root {
        --void: #12130f;
        --panel: #1b1d18;
        --panel-2: #24261f;
        --rule: #35382d;
        --ink: #e8e4d6;
        --ink-dim: #8c8a82;
        --ember: #efa827;
        --char: #d85a30;
        --mint: #9fe1cb;
        --mono:
          ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --sans: "Helvetica Neue", Inter, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: var(--void);
        color: var(--ink);
        font-family: var(--sans);
        display: flex;
        justify-content: center;
      }
      .shell {
        width: 100%;
        max-width: 680px;
      }

      canvas {
        width: 100%;
        display: block;
        background: var(--panel);
        border: 1px solid var(--rule);
        touch-action: none;
        cursor: crosshair;
      }

      .controls {
        display: flex;
        gap: 6px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      button {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 9px 14px;
        background: var(--panel-2);
        color: var(--ink);
        border: 1px solid var(--rule);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--ember);
        color: var(--ember);
      }
      button:focus-visible {
        outline: 2px solid var(--mint);
        outline-offset: 2px;
      }
      #btn-burn {
        flex: 1;
      }
      #btn-burn:hover {
        border-color: var(--char);
        color: var(--char);
      }
      #btn-mute.off {
        color: var(--ink-dim);
        border-color: var(--rule);
        opacity: 0.7;
      }

      .speed {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
      }
      .speed label {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
      .speed input {
        flex: 1;
        accent-color: var(--ember);
      }
      #speed-label {
        font-family: var(--mono);
        font-size: 11px;
        width: 44px;
        text-align: right;
      }

      #status {
        margin-top: 12px;
        min-height: 20px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-dim);
      }
      .keys {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--rule);
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-dim);
        letter-spacing: 0.06em;
        line-height: 1.9;
      }
      .keys b {
        color: var(--ink);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <canvas id="stage" width="640" height="480"></canvas>

      <p id="status">Drag back from Earth and release.</p>

      <div class="controls">
        <button id="btn-left">&#9664; Steer</button>
        <button id="btn-burn">Burn</button>
        <button id="btn-right">Steer &#9654;</button>
        <button id="btn-stage">Drop stage</button>
        <button id="btn-restart">Restart</button>
        <button id="btn-mute">Sound on</button>
      </div>

      <div class="speed">
        <label for="speed">Sim speed</label>
        <input type="range" id="speed" />
        <span id="speed-label">0.40×</span>
      </div>

      <div class="keys">
        <b>Drag + release</b> launch &nbsp;·&nbsp; <b>Space</b> burn
        &nbsp;·&nbsp; <b>&#8592; &#8594; / A D</b> steer &nbsp;·&nbsp;
        <b>S</b> drop stage &nbsp;·&nbsp; <b>R</b> restart &nbsp;·&nbsp;
        <b>M</b> mute<br />
        Hit a planet and the dish is caught in orbit — it keeps cooking there,
        so drag again to relaunch it. Free, but the kaiju is still coming.
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
